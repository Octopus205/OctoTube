name: Extract OctoTube source for review

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/extract-source-review.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract prepared project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f OctoTube-project-ready.zip
          mkdir -p /tmp/octotube-unpack
          unzip -q OctoTube-project-ready.zip -d /tmp/octotube-unpack

          SETTINGS_FILE="$(find /tmp/octotube-unpack -type f \\( -name settings.gradle -o -name settings.gradle.kts \\) -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No Gradle settings file found in OctoTube-project-ready.zip"
            find /tmp/octotube-unpack -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          mkdir -p extracted-project
          cp -a "$PROJECT_DIR"/. extracted-project/
          echo "Extracted project root: $PROJECT_DIR"
          echo "Top-level project files:"
          find extracted-project -maxdepth 2 -type f | sort | head -200

      - name: Publish extracted source on an isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C source-review
          git add extracted-project
          git commit -m "Extract OctoTube project source for review" || echo "No source changes"
          git push --force origin source-review
