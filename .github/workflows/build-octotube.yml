name: Build OctoTube APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'OctoTube-project-ready.zip'
      - '.github/workflows/build-octotube.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract prepared Android project
        run: |
          mkdir -p source
          unzip -q OctoTube-project-ready.zip -d source
          GRADLEW="$(find source -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "Could not find gradlew in the prepared ZIP."
            find source -maxdepth 3 -type f | head -100
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OctoTube-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
