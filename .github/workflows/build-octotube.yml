name: Build OctoTube APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'OctoTube-project-ready.zip'
      - '.github/workflows/build-octotube.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project and install its declared Gradle version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q OctoTube-project-ready.zip -d source

          SETTINGS_FILE="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No Gradle settings file found in OctoTube-project-ready.zip"
            find source -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          WRAPPER_PROPERTIES="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ ! -f "$WRAPPER_PROPERTIES" ]; then
            echo "::error::gradle-wrapper.properties is missing from the project ZIP"
            exit 1
          fi

          DIST_URL="$(sed -n 's/^distributionUrl=//p' "$WRAPPER_PROPERTIES" | tr -d '\\')"
          if [ -z "$DIST_URL" ]; then
            echo "::error::Could not read Gradle distributionUrl"
            cat "$WRAPPER_PROPERTIES"
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "Gradle distribution: $DIST_URL"
          curl --fail --location --retry 3 "$DIST_URL" --output /tmp/gradle.zip
          mkdir -p /tmp/gradle-dist
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          GRADLE_BIN="$(find /tmp/gradle-dist -type f -path '*/bin/gradle' -print -quit)"
          if [ -z "$GRADLE_BIN" ]; then
            echo "::error::Gradle executable was not found after extraction"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "GRADLE_BIN=$GRADLE_BIN" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          "$GRADLE_BIN" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OctoTube-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
