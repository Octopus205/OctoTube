name: Build OctoTube APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'extracted-project/**'
      - '.github/workflows/build-octotube.yml'

concurrency:
  group: octotube-main-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install declared Gradle version
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="extracted-project"
          SETTINGS_FILE="$PROJECT_DIR/settings.gradle.kts"
          if [ ! -f "$SETTINGS_FILE" ]; then
            echo "::error::Extracted Gradle project not found"
            exit 1
          fi
          WRAPPER_PROPERTIES="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          DIST_URL="$(sed -n 's/^distributionUrl=//p' "$WRAPPER_PROPERTIES" | tr -d '\\\\')"
          if [ -z "$DIST_URL" ]; then
            echo "::error::Could not read Gradle distributionUrl"
            cat "$WRAPPER_PROPERTIES"
            exit 1
          fi
          curl --fail --location --retry 3 "$DIST_URL" --output /tmp/gradle.zip
          mkdir -p /tmp/gradle-dist
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          GRADLE_BIN="$(find /tmp/gradle-dist -type f -path '*/bin/gradle' -print -quit)"
          if [ -z "$GRADLE_BIN" ]; then
            echo "::error::Gradle executable was not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "GRADLE_BIN=$GRADLE_BIN" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          "$GRADLE_BIN" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OctoTube-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
